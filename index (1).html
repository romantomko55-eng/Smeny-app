<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
const firebaseConfig = {"apiKey": "AIzaSyCfWO5UB9DNnZNt-H6QmuSscYYhIfJrSHQ", "authDomain": "smeny-app-706cc.firebaseapp.com", "projectId": "smeny-app-706cc", "storageBucket": "smeny-app-706cc.firebasestorage.app", "messagingSenderId": "837726816614", "appId": "1:837726816614:web:c7070d9759b8d2e4ba20a7", "measurementId": "G-9GGBPQ10KZ"};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const provider = new GoogleAuthProvider();

window.firebaseAuth = auth;
window.firebaseSignIn = () => signInWithPopup(auth, provider);
window.firebaseSignOut = () => { localStorage.removeItem('smeny_firebase_user'); return signOut(auth); };

onAuthStateChanged(auth, (user) => {
  window.dispatchEvent(new CustomEvent('firebase-user', {detail: user}));
  if(user){ localStorage.setItem('smeny_firebase_user', JSON.stringify({email: user.email, name: user.displayName, picture: user.photoURL, uid: user.uid})); } else { localStorage.removeItem('smeny_firebase_user'); }
});

// Restore user
const saved = localStorage.getItem('smeny_firebase_user');
if(saved && saved!='null'){
  try{ window.dispatchEvent(new CustomEvent('firebase-user', {detail: JSON.parse(saved)})); }catch(e){}
}
</script>

    <img id="user-avatar" style="width:28px;height:28px;border-radius:50%;display:none" />
    <button id="btn-login" class="btn-google"><img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="16" /> Přihlásit přes Google</button>

<script>
const loginBtn = document.getElementById('btn-login');
const logoutBtn = document.getElementById('btn-logout');
const label = document.getElementById('user-label');
const avatar = document.getElementById('user-avatar');

function updateUserUI(user){
  const u = user?.detail || user;
  const real = u && (u.email || u.displayName) ? u : (u?.detail ? u.detail : null);
  // handle CustomEvent
  let data = u;
  if(u && u.detail) data = u.detail;
  if(!data || data==='null'){ 
    label.textContent='Nepřihlášen'; 
    avatar.style.display='none'; 
    loginBtn.style.display='flex'; 
    logoutBtn.style.display='none'; 
    return;
  }
  label.textContent = (data.displayName || data.name || '') + ' • ' + (data.email || '');
  if(data.photoURL || data.picture){ avatar.src = data.photoURL || data.picture; avatar.style.display='block'; }
  loginBtn.style.display='none'; logoutBtn.style.display='block';
}

loginBtn.onclick = () => { window.firebaseSignIn().catch(e=>alert('Chyba: '+e.message)); };
logoutBtn.onclick = async () => {
  try{
    await window.firebaseSignOut();
    localStorage.removeItem('smeny_firebase_user');
    label.textContent='Nepřihlášen';
    avatar.style.display='none';
    loginBtn.style.display='flex';
    logoutBtn.style.display='none';
    location.reload();
  }catch(e){ alert('Chyba odhlášení: '+e.message); }
};

window.addEventListener('firebase-user', updateUserUI);
window.addEventListener('load', ()=>{
  document.body.style.paddingTop='52px';
  const saved = localStorage.getItem('smeny_firebase_user');
  if(saved) try{ updateUserUI(JSON.parse(saved)); }catch(e){}
});
</script>
